<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>selftest</title>
    <style>
      body { background: #111; color: #ddd; font: 13px ui-monospace, Consolas, monospace; padding: 16px; }
      .ok { color: #7bd88f; }
      .bad { color: #ff6b6b; }
      pre { background: #191919; padding: 8px; }
    </style>
  </head>
  <body>
    <div id="out">running…</div>
    <script type="module">
      import { loadRegion } from './js/text.js';
      import { makeElement, PRESETS } from './js/model.js';
      import { parseFormat } from './js/format.js';
      import { buildGecko, bgRect } from './js/gecko.js';

      const hex4 = (r) => r.map((v) => (v & 0xffff).toString(16).toUpperCase().padStart(4, '0'))
        .join('').replace(/^(.{8})/, '$1 ');

      const lines = [];
      const check = (name, actual, expected) => {
        const ok = JSON.stringify(actual) === JSON.stringify(expected);
        lines.push(
          `<div class="${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'} ${name}` +
            (ok ? '' : ` — got ${JSON.stringify(actual)}, want ${JSON.stringify(expected)}`) +
            '</div>',
        );
      };

      try {
        await loadRegion('US');

        const pas = parseFormat(PRESETS.PAS.config.fmt, 'US');
        check('PAS field ids', pas.fieldIds, [1, 2, 3, 4, 5, 6]);
        check('PAS format', pas.format,
          'X Pos %.0f\nY Pos %.0f\nZ Pos %.0f\nAngle %hu\nH Spd %.2f\nV Spd %.2f');
        check('PAS preview line 1', pas.preview.split('\n')[0], 'X Pos 39');
        check('percent escaping', parseFormat('100% <qf>', 'US').format, '100%% %u');
        check('unknown field', parseFormat('<nope>', 'US').errors.length, 1);
        check('spin is %s', parseFormat('<spin>', 'US').format, '%s');
        check('hex spec', parseFormat('<angle|04X>', 'US').format, '%04hX');

        // Gecko output: only qft/qfst are emitted, everything else is dropped.
        const els = [makeElement('display', PRESETS.PAS.config), makeElement('qft')];
        const { lines: code, dropped } = buildGecko(els, 'US');
        check('display dropped', dropped, ['display']);
        // 06 header + 32 bytes of qft config = 4 payload lines.
        check('qft line count', code.length, 5);
        // US __ArenaLo 0x80429800 + config 0x60
        check('qft address line', code[0], '06429860 00000020');
        // x=16, y=456
        check('qft x/y', code[1].split(' ')[0], '001001C8');
        // resolved bg rect: x0/y0 then x1/y1
        check('qft bg rect', code[1].split(' ')[1] + ' ' + code[2].split(' ')[0],
          hex4(bgRect(els[1], 'US')));
        // fontSize 20, no gradient
        check('qft fontSize', code[2].split(' ')[1], '00140000');
        check('qft fg top/bottom', code[3], 'FFFFFFFF FFFFFFFF');
        // bg 50% black, then freezeDuration 30 and its pad
        check('qft bg + freeze', code[4], '00000080 001E0000');

        const qfst = buildGecko([makeElement('qfst')], 'JP');
        check('qfst address line', qfst.lines[0], '064260A0 0000001C');
        check('qfst line count', qfst.lines.length, 5);

        check('nothing configured emits nothing', buildGecko([], 'US').lines.length, 0);

        // The mod's compiled-in defaults must equal what this page emits for an
        // untouched element, or a user who changes nothing still needs a code.
        lines.push('<div>qft default rect ' + JSON.stringify(bgRect(makeElement('qft'), 'US')) +
          ', qfst ' + JSON.stringify(bgRect(makeElement('qfst'), 'US')) + '</div>');

        lines.push(`<pre>${code.join('\n')}</pre>`);
      } catch (e) {
        lines.push(`<div class="bad">THREW ${e && e.stack ? e.stack : e}</div>`);
      }
      document.getElementById('out').innerHTML = lines.join('');
    </script>
  </body>
</html>
