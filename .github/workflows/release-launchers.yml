name: Build Moonshine release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Moonshine Launcher
    # The bundled devkitPro toolchain is Windows-specific.  Pin the runner so
    # its pre-installed CMake/Ninja versions cannot change unexpectedly.
    runs-on: windows-2022

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Install build dependencies
        run: python setup_venv.py

      # One launcher serves all three discs now, so this is a single job rather
      # than a region matrix; the preset sets VERS to all three, which is what
      # decides the mod_<region>.bin files bundled into the app.
      - name: Configure console build
        run: cmake --preset release_console

      - name: Build launcher
        run: cmake --build --preset console

      - name: Upload launcher to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/moonshine_launcher.zip" --clobber

  build-emulator-patch:
    name: Moonshine emulator BPS
    runs-on: windows-2022

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Install build dependencies
        run: python setup_venv.py

      - name: Configure Dolphin build
        run: cmake --preset release_emu -DVERS="jp;us;pal"

      - name: Build source-free BPS patches
        run: cmake --build --preset emu_patches

      - name: Add version to emulator patch names
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          Rename-Item -LiteralPath "build/moonshine_jp.bps" -NewName "moonshine_emu_jp_${env:RELEASE_TAG}.bps"
          Rename-Item -LiteralPath "build/moonshine_us.bps" -NewName "moonshine_emu_us_${env:RELEASE_TAG}.bps"
          Rename-Item -LiteralPath "build/moonshine_pal.bps" -NewName "moonshine_emu_pal_${env:RELEASE_TAG}.bps"

      - name: Upload emulator patches to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${env:RELEASE_TAG}"
          "build/moonshine_emu_jp_${env:RELEASE_TAG}.bps"
          "build/moonshine_emu_us_${env:RELEASE_TAG}.bps"
          "build/moonshine_emu_pal_${env:RELEASE_TAG}.bps"
          --clobber
